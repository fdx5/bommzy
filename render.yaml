# Render Blueprint: one Node web service serves the game (client/dist) and the /api leaderboard backed by Turso.
services:
  - type: web
    name: boomzy
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL   # libsql://<db>-<org>.turso.io
        sync: false
      - key: TURSO_AUTH_TOKEN     # turso db tokens create <db>
        sync: false
